# MySQL Database Configuration Profile
# Ensure database 'movie_review_db' exists or createDatabaseIfNotExist will create it.
spring.datasource.url=jdbc:mysql://localhost:3306/movie_review_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
# Replace with your local MySQL password
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
